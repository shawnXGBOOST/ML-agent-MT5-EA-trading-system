[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mltrader"
version = "0.1.0"
description = "ML swing-trading pipeline: BOS detection → triple-barrier labeling → XGBoost → calibration → EV filter → risk agent → MQL5 EA"
requires-python = ">=3.10"
dependencies = [
    "xgboost==2.1.4",
    "scikit-learn==1.5.2",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "MetaTrader5==5.0.45; sys_platform == 'win32'",
    "requests==2.32.3",
    "joblib==1.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.9.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
