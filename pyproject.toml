[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mltrader"
version = "0.1.0"
description = "ML swing-trading pipeline: BOS detection → triple-barrier labeling → XGBoost → calibration → EV filter → risk agent → MQL5 EA"
requires-python = ">=3.11"
dependencies = [
    "xgboost==3.0.3",
    "scikit-learn==1.9.0",
    "pandas==3.0.5",
    "numpy==2.4.6",
    "MetaTrader5==5.0.5120; sys_platform == 'win32'",
    "requests==2.34.2",
    "joblib==1.5.1",
    "lightgbm>=4.0",
]

[project.optional-dependencies]
dashboard = ["flask"]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.9.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
